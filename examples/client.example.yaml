# hydr-client example config — see SECURITY.md
# Рекомендуется: password_file или env HYDR_PASSWORD (файл 0o600).
# password: "change-me-32-bytes-random-please"  # deprecated: inline
# password_file: "/etc/hydr/password"
password: "change-me-32-bytes-random-please"

# target send rate in bits/s (0 = default congestion control)
cc_rx: 0

# local SOCKS5 entry
socks5_bind: "127.0.0.1:1080"
# SOCKS5 user/pass (RFC 1929). REQUIRED when binding to a non-loopback address,
# otherwise anyone on the network can use the proxy. Password via env HYDR_SOCKS5_PASSWORD.
# socks5_username: "user"
# socks5_password: "change-me-too"

transport:
  type: quic
  addr: "1.2.3.4:8443"
  server_name: "example.com"
  # SECURITY: pin the server's SHA-256 fingerprint instead of insecure:true.
  # The server prints it on startup: "QUIC certificate fingerprint (sha256): ..."
  fingerprint: "a1b2c3...64-hex-chars"
  insecure: false
  # alternative: ws
  # type: ws
  # url: "wss://example.com/hydr"
  # insecure: false
  # obfuscation: "my-secret-key-32-bytes"
  # fingerprint: "a1b2c3...64-hex-chars"
