# hydr-server example config — see SECURITY.md
# Пароль: используйте `password_file` или env HYDR_PASSWORD (файл 0o600).
# Пример с env: HYDR_PASSWORD="change-me-32-bytes-random" hydr-server -c server.yaml
# password: "change-me-32-bytes-random-please"  # deprecated: храните в файле/env
# password_file: "/etc/hydr/password"  # файл 0o600, одна строка
password: "change-me-32-bytes-random-please"

# target receive rate in bits/s (0 = default congestion control)
cc_rx: 0

# max concurrent tunnels (0 = default 1024)
max_conns: 0

# UDP session caps: global (0 = default 4096) and per client IP (0 = default 64);
# excess sessions are rejected with [code 0x02] (rate limited)
max_udp_sessions: 0
max_udp_sessions_per_ip: 0

# Prometheus /metrics endpoint (empty = disabled); scrape locally, e.g. 127.0.0.1:9090
# metrics_bind: "127.0.0.1:9090"

quic:
  bind: "0.0.0.0:8443"
  server_name: "example.com"
  # optional PEM cert/key pair: keeps the certificate (and its fingerprint,
  # which clients pin) stable across restarts; without them a fresh
  # self-signed certificate is generated on every start and printed to the log
  # cert: "/etc/hydr/cert.pem"  # 0o600
  # key: "/etc/hydr/key.pem"    # 0o600

ws:
  bind: "0.0.0.0:8080"
  path: "/hydr"
  # optional obfuscation key (must match client)
  # obfuscation: "my-secret-key-32-bytes"

# optional multi-hop relay
# next_hop:
#   password: "hop-password"
#   transport:
#     type: quic
#     addr: "2.2.2.2:8443"
#     server_name: "hop.example.com"
#     # SECURITY: never use insecure:true in production — pin the hop's cert:
#     insecure: false
#     fingerprint: "a1b2c3...64-hex-chars-sha256-of-hop-cert"
#   # or:
#   # type: ws
#   # url: "wss://hop.example.com/hydr"
#   # insecure: false
#   # fingerprint: "a1b2c3...64-hex-chars"
#   # obfuscation: "my-secret-key"
