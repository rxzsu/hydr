name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Строгая проверка уязвимостей по расписанию: ловит новые CVE в уже
  # зафиксированных зависимостях (Cargo.lock) без нового коммита.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test -p hydr-core --features proto
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      # Блокирующие проверки безопасности: уязвимость в зависимостях должна
      # ронять CI, а не проходить silently. Установка инструментов остаётся
      # best-effort (сеть до crates.io может быть недоступна), но сами
      # проверки строгие: если бинарь не поставился — шаг помечает warning
      # через `command -v`, а не молча глотает результат.
      - name: install cargo-audit
        run: cargo install cargo-audit --locked || echo "::warning::cargo-audit install failed (network?)"
      - name: cargo audit (blocking)
        run: |
          if command -v cargo-audit >/dev/null; then cargo audit; else echo "::warning::cargo-audit missing, skipping"; exit 1; fi
      - name: install cargo-deny
        run: cargo install cargo-deny --locked || echo "::warning::cargo-deny install failed (network?)"
      - name: cargo deny (blocking)
        run: |
          if command -v cargo-deny >/dev/null; then cargo deny check; else echo "::warning::cargo-deny missing, skipping"; exit 1; fi

  # Еженедельный строгий аудит зафиксированных зависимостей (по расписанию
  # и вручную): дублирует проверки из `check`, чтобы новые CVE в Cargo.lock
  # ловились без нового коммита.
  audit-scheduled:
    name: scheduled security audit (strict)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  # Опциональный Protobuf-IDL (feature `proto`) требует бинарь `protoc`.
  proto:
    name: proto feature (protoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build -p hydr-core --features proto
      - run: cargo test -p hydr-core --features proto

  msrv:
    name: MSRV 1.95.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - run: cargo check --workspace

  # Best-effort: не падает CI при недоступности сети до crates.io.
  outdated:
    name: cargo outdated (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - run: cargo install cargo-outdated --locked || true
      - run: cargo outdated -d 1 || true
