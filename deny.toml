[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
yanked = "warn"
unmaintained = "warn"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0"]
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
